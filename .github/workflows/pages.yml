name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/currency-converter-app-9g3z21]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on laisse finir celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Le site est déjà statique : on ne recopie que les fichiers servis,
      # pour ne pas publier node_modules ni l'outillage de test.
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/

      # enablement: active Pages via l'API si ce n'est pas deja fait, ce qui
      # evite d'avoir a le regler a la main dans Settings -> Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
