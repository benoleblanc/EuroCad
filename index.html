<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EuroCad</title>
<meta name="description" content="Convertisseur EUR / CAD instantané, fonctionne hors-ligne.">
<link rel="manifest" href="manifest.webmanifest">
<meta id="tc" name="theme-color" content="#eceff5">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#e9edf4; --surface:#ffffff; --line:#d7dee9;
  --text:#141821; --muted:#596273; --accent:#1e47c8;
  --ok:#15803d; --stale:#b45309; --old:#98a1b0;
  --shadow:0 1px 2px rgba(19,27,45,.05), 0 3px 10px rgba(19,27,45,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --surface:#171a20; --line:#262b34;
    --text:#f0f2f6; --muted:#939bab; --accent:#6ea8ff;
    --ok:#22c55e; --stale:#f59e0b; --old:#8b93a1;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --line:#262b34;
  --text:#f0f2f6; --muted:#939bab; --accent:#6ea8ff;
  --ok:#22c55e; --stale:#f59e0b; --old:#8b93a1;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh; display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);
  overscroll-behavior:none;
}
header{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-height:32px;flex:none}
#dot{width:9px;height:9px;border-radius:50%;background:var(--old);flex:none}
#asof{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dot.ok{background:var(--ok)} #dot.stale{background:var(--stale)}
main{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:10px;min-height:0}
.row,#keys,#swap,#saveRow{flex:none}
.row{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:14px 16px; display:flex; align-items:baseline; gap:12px;
  box-shadow:var(--shadow);
}
.cur{font-size:15px;font-weight:600;color:var(--muted);flex:none;width:52px}
#amt,#res{
  flex:1;min-width:0;font-size:38px;font-weight:600;line-height:1.15;
  text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.5px;
}
#amt{border:0;background:transparent;color:var(--text);padding:0;font-family:inherit;appearance:none;border-radius:0}
#amt:focus{outline:none}
#amt::placeholder{color:var(--muted);opacity:.45}
#res{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#res.err{color:var(--muted);opacity:.5}
/* Le clavier decimal d'Android n'offre aucun operateur : on les fournit ici. */
#keys{display:flex;gap:6px}
#keys button{
  flex:1;min-width:0;padding:11px 0;font-size:17px;font-family:inherit;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  cursor:pointer;touch-action:manipulation;
}
#keys button:active{background:var(--line)}
#ac{color:var(--accent);font-weight:600}
#swap{
  align-self:center;width:44px;height:44px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  font-size:19px;cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;padding:0;
}
#swap:active{background:var(--line)}
#saveRow{display:flex;gap:8px}
#note{
  flex:1;min-width:0;padding:10px 13px;font:14px/1.3 inherit;font-family:inherit;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);
}
#note:focus{outline:none;border-color:var(--accent)}
#note::placeholder{color:var(--muted);opacity:.7}
#save{
  flex:none;padding:10px 15px;font:14px/1.3 inherit;font-family:inherit;font-weight:600;
  background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:12px;
  cursor:pointer;touch-action:manipulation;min-width:104px;
}
#save:active{opacity:.8}
#save.done{background:var(--ok);border-color:var(--ok)}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);flex:none}
#rate{font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;gap:7px;cursor:pointer;flex:none;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.track{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s;flex:none}
.track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked + .track{background:var(--accent)}
.sw input:checked + .track::after{transform:translateX(14px)}
.ghost{
  flex:none;padding:6px 11px;font:13px/1.3 inherit;font-family:inherit;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  cursor:pointer;touch-action:manipulation;
}
.ghost:active{background:var(--line)}
#themeBtn{margin-left:auto;padding:6px 10px;font-size:14px;line-height:1.3}
#count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}

/* ---- Historique : panneau plein écran, hors du chemin rapide ------------- */
#panel{
  position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);
}
#panelHead{display:flex;align-items:center;gap:10px;flex:none;margin-bottom:10px}
#panelHead h2{margin:0;font-size:17px;font-weight:600}
#totals{flex:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.total{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:9px 13px;font-size:14px;font-variant-numeric:tabular-nums;
}
.total b{font-size:16px}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;min-height:0}
.item{
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:11px 13px;display:flex;align-items:flex-start;gap:10px;
  box-shadow:var(--shadow);
}
.item .main{flex:1;min-width:0}
.item .conv{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.item .conv .arrow{color:var(--muted);font-weight:400;margin:0 5px}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:3px;word-break:break-word}
.item .note{color:var(--text);opacity:.85}
.del{
  flex:none;width:30px;height:30px;border-radius:8px;padding:0;font-size:15px;
  background:transparent;border:1px solid var(--line);color:var(--muted);cursor:pointer;
}
.del:active{background:var(--line)}
#empty{color:var(--muted);font-size:14px;text-align:center;padding:34px 0}
#panelFoot{flex:none;margin-top:10px;display:flex;justify-content:flex-end}
#wipe{color:#dc2626;border-color:var(--line)}
button:focus-visible,input:focus-visible,.sw input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* Clavier ouvert : la hauteur disponible fond. On réduit par paliers au lieu
   de laisser les blocs s'écraser les uns sur les autres. */
@media (max-height:640px){
  body{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
  main{gap:7px}
  .row{padding:10px 14px;border-radius:13px}
  #amt,#res{font-size:30px}
  #keys button{padding:9px 0;font-size:16px}
  #swap{width:38px;height:38px;font-size:17px}
  #note,#save{padding-top:8px;padding-bottom:8px}
}
@media (max-height:470px){
  main{gap:5px}
  .row{padding:7px 12px}
  #amt,#res{font-size:23px}
  #swap{width:30px;height:30px;font-size:15px}
  #keys button{padding:7px 0;font-size:15px}
  header,footer{font-size:12px}
  header{min-height:26px}
}
</style>
</head>
<body>

<header>
  <span id="dot" aria-hidden="true"></span>
  <span id="asof">taux de secours</span>
  <button id="themeBtn" class="ghost" type="button">◐</button>
  <button id="histBtn" class="ghost" type="button">Historique <span id="count"></span></button>
</header>

<main>
  <div class="row">
    <span class="cur" id="curFrom">EUR</span>
    <input id="amt" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           aria-label="Montant à convertir" autofocus>
  </div>

  <div id="keys">
    <button type="button" data-ins="+" aria-label="plus">+</button>
    <button type="button" data-ins="-" aria-label="moins">−</button>
    <button type="button" data-ins="*" aria-label="multiplié par">×</button>
    <button type="button" data-ins="/" aria-label="divisé par">÷</button>
    <button type="button" id="eq" aria-label="Calculer le total">=</button>
    <button type="button" id="clr" aria-label="Effacer un caractère">⌫</button>
    <button type="button" id="ac" aria-label="Tout effacer">C</button>
  </div>

  <button id="swap" type="button" aria-label="Inverser le sens de conversion">⇅</button>

  <div class="row">
    <span class="cur" id="curTo">CAD</span>
    <output id="res" for="amt">0,00</output>
  </div>

  <div id="saveRow">
    <input id="note" type="text" placeholder="note (facultatif)" aria-label="Note"
           autocomplete="off" enterkeyhint="done" maxlength="120">
    <button id="save" type="button">Enregistrer</button>
  </div>
</main>

<footer>
  <span id="rate"></span>
  <label class="sw" title="Ajoute 2,5 % pour approcher le taux réellement facturé par une carte bancaire">
    <input type="checkbox" id="fee">
    <span class="track"></span>
    <span>carte</span>
  </label>
</footer>

<div id="panel" hidden role="dialog" aria-modal="true" aria-label="Historique des conversions">
  <div id="panelHead">
    <h2>Historique</h2>
    <button id="close" class="ghost" type="button" style="margin-left:auto">Fermer</button>
  </div>
  <div id="totals"></div>
  <div id="list"></div>
  <div id="panelFoot"><button id="wipe" class="ghost" type="button">Tout effacer</button></div>
</div>

<script>
(function(){
"use strict";

// Taux de secours : BCE, utilisé uniquement au tout premier lancement hors-ligne.
// Écrasé dès le premier chargement en ligne.
var SEED = { rate: 1.6087, date: "2026-09-16", fetched: 0 };
var API  = "https://api.frankfurter.app/latest?from=EUR&to=CAD";
var FEE  = 0.025;      // marge carte approximative
var HMAX = 200;        // plafond de l'historique, pour ne pas gonfler sans fin

var LS_RATE = "eurocad.rate", LS_DIR = "eurocad.dir",
    LS_FEE  = "eurocad.fee",  LS_HIST = "eurocad.hist";

var $ = function(id){ return document.getElementById(id); };
var amt  = $("amt"),  res   = $("res"),  dot  = $("dot"),   asof = $("asof"),
    rateL= $("rate"), curF  = $("curFrom"), curT = $("curTo"), fee = $("fee"),
    note = $("note"), save  = $("save"), panel= $("panel"), list = $("list"),
    totals=$("totals"), count= $("count");

var nf  = new Intl.NumberFormat("fr-CA",{minimumFractionDigits:2,maximumFractionDigits:2});
var nf4 = new Intl.NumberFormat("fr-CA",{minimumFractionDigits:2,maximumFractionDigits:4});
var df  = new Intl.DateTimeFormat("fr-CA",{day:"numeric",month:"short"});
var dfh = new Intl.DateTimeFormat("fr-CA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

var data = SEED;
try{
  var raw = load(LS_RATE);
  if(raw){
    var p = JSON.parse(raw);
    if(p && typeof p.rate === "number" && isFinite(p.rate) && p.rate > 0) data = p;
  }
}catch(e){}

/* ---- Thème : automatique, sombre ou clair -------------------------------- */
var LS_THEME = "eurocad.theme";
var THEMES = ["auto", "dark", "light"];
var GLYPH  = { auto:"\u25D0", dark:"\u263E", light:"\u2600" };
var LABEL  = { auto:"automatique", dark:"sombre", light:"clair" };
var BG     = { dark:"#0e1014", light:"#e9edf4" };

var theme = load(LS_THEME);
if(THEMES.indexOf(theme) < 0) theme = "auto";
var applying = false;

function prefersDark(){
  try{ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
  catch(e){ return false; }
}

function applyTheme(){
  applying = true;
  var root = document.documentElement;
  if(theme === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", theme);

  var btn = $("themeBtn");
  btn.textContent = GLYPH[theme];
  btn.setAttribute("aria-label", "Thème : " + LABEL[theme] + ". Toucher pour changer.");
  btn.title = "Thème : " + LABEL[theme];

  // Barre d'état d'Android : elle doit suivre le thème réellement affiché.
  var m = $("tc");
  if(m) m.setAttribute("content", (theme === "dark" || (theme === "auto" && prefersDark()))
    ? BG.dark : BG.light);
  applying = false;
}

// Certains hôtes — le lecteur d'artifacts de claude.ai — imposent leur propre
// data-theme sur la page. Quand un choix explicite existe, on le réapplique.
if(window.MutationObserver){
  new MutationObserver(function(){
    if(applying || theme === "auto") return;
    if(document.documentElement.getAttribute("data-theme") !== theme) applyTheme();
  }).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
}

try{
  window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", function(){ if(theme === "auto") applyTheme(); });
}catch(e){}

var dir = load(LS_DIR) === "CADEUR" ? "CADEUR" : "EURCAD";

// « = » remplace « 100+50 » par « 150 » dans le champ : sans mémoire, le calcul
// serait perdu pour l'historique. On retient donc ce qui a été replié, tant que
// le champ commence toujours par le total produit.
var folded = null;   // { from:"100+50", to:"150" }
fee.checked = load(LS_FEE) === "1";

var hist = [];
try{
  var rh = load(LS_HIST);
  if(rh){ var ph = JSON.parse(rh); if(Array.isArray(ph)) hist = ph; }
}catch(e){}

/* ---- Évaluation arithmétique (sans eval) ---------------------------------
   expr := term (('+'|'-') term)*
   term := factor (('*'|'/') factor)*
   factor := ('-'|'+') factor | '(' expr ')' | nombre                       */
function evaluate(src){
  var s = String(src).replace(/\s+/g,"").replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/");
  if(!s) return null;
  if(!/^[0-9.+\-*/()]+$/.test(s)) return null;
  var i = 0;

  function peek(){ return s.charAt(i); }

  function factor(){
    var c = peek();
    if(c === "-"){ i++; var n = factor(); return n === null ? null : -n; }
    if(c === "+"){ i++; return factor(); }
    if(c === "("){
      i++;
      var v = expr();
      if(v === null || peek() !== ")") return null;
      i++;
      return v;
    }
    var start = i;
    while(i < s.length && /[0-9.]/.test(s.charAt(i))) i++;
    if(i === start) return null;
    var num = s.slice(start,i);
    if(num.split(".").length > 2) return null;
    var n2 = parseFloat(num);
    return isFinite(n2) ? n2 : null;
  }

  function term(){
    var v = factor();
    if(v === null) return null;
    while(peek() === "*" || peek() === "/"){
      var op = s.charAt(i++), r = factor();
      if(r === null) return null;
      if(op === "/" && r === 0) return null;
      v = op === "*" ? v * r : v / r;
    }
    return v;
  }

  function expr(){
    var v = term();
    if(v === null) return null;
    while(peek() === "+" || peek() === "-"){
      var op = s.charAt(i++), r = term();
      if(r === null) return null;
      v = op === "+" ? v + r : v - r;
    }
    return v;
  }

  var out = expr();
  if(out === null || i !== s.length || !isFinite(out)) return null;
  return out;
}

// Parenthèses encore ouvertes pendant la frappe : on ferme provisoirement.
function tryClose(s){
  if(!s) return null;
  var open = 0;
  for(var k = 0; k < s.length; k++){
    var c = s.charAt(k);
    if(c === "(") open++; else if(c === ")") open--;
  }
  if(open > 0){
    var pad = "";
    while(pad.length < open) pad += ")";
    return evaluate(s + pad);
  }
  return evaluate(s);
}

// Pendant la frappe "12+" n'est pas encore une expression valide. On ne rogne
// QUE des caractères d'expression incomplète (opérateur, parenthèse ouvrante,
// séparateur décimal) : rogner un chiffre transformerait une erreur réelle
// ("5/0", "1.2.3") en montant faux affiché sans avertissement.
function evalLoose(src){
  var s = String(src);
  for(;;){
    var v = tryClose(s);
    if(v !== null) return v;
    if(!s.length || !/[+\-*/(.,]$/.test(s)) return null;
    s = s.slice(0,-1);
  }
}

// Réécrit un total dans le champ : arrondi au centime, sans séparateur de
// milliers, pour rester ré-analysable par evaluate() au coup suivant.
function plain(n){
  var r = Math.round(n * 100) / 100;
  var s = Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(2);
  return s.replace(".", ",");
}

// Recompose le calcul réellement fait : « 150/2 » redevient « (100+50)/2 ».
function fullExpr(){
  var v = amt.value.trim();
  if(folded && v.indexOf(folded.to) === 0){
    var rest = v.slice(folded.to.length);
    return rest ? "(" + folded.from + ")" + rest : folded.from;
  }
  return v;
}

/* ---- Rendu --------------------------------------------------------------- */
function convert(n){
  var v = dir === "EURCAD" ? n * data.rate : n / data.rate;
  // La marge carte renchérit toujours la conversion, quel que soit le sens :
  // elle répond à « combien ça me coûte vraiment ? ».
  return fee.checked ? v * (1 + FEE) : v;
}

function render(){
  if(folded && amt.value.trim().indexOf(folded.to) !== 0) folded = null;

  curF.textContent = dir === "EURCAD" ? "EUR" : "CAD";
  curT.textContent = dir === "EURCAD" ? "CAD" : "EUR";

  var v = evalLoose(amt.value);
  if(amt.value.trim() === "" || v === null){
    res.textContent = amt.value.trim() === "" ? nf.format(0) : "—";
    res.classList.toggle("err", amt.value.trim() !== "");
  }else{
    res.classList.remove("err");
    res.textContent = nf.format(convert(v));
  }

  // Le taux affiché doit être celui réellement appliqué au résultat, marge
  // carte comprise : sinon la ligne du bas contredit le grand chiffre.
  var shown = dir === "EURCAD" ? data.rate : 1/data.rate;
  if(fee.checked) shown *= (1 + FEE);
  var base = (dir === "EURCAD" ? "1 € = " + nf4.format(shown) + " $"
                               : "1 $ = " + nf4.format(shown) + " €")
           + (fee.checked ? " (carte)" : "");
  // Repère mental : toujours exprimé sur le taux EUR→CAD, plus facile à
  // manipuler de tête (« ÷1,6 ») que le 0,62 de l'autre sens.
  var cmp    = dir === "EURCAD" ? shown : 1/shown;
  var round1 = Math.round(cmp*10)/10;
  rateL.textContent = base + (nf4.format(round1) === nf4.format(cmp)
    ? ""
    : "  ·  ≈ " + (dir === "EURCAD" ? "×" : "÷") + nf4.format(round1));

  var age = data.fetched ? Date.now() - data.fetched : Infinity;
  dot.className = age < 864e5 ? "ok" : (age < 3456e5 ? "stale" : "");

  var parts = data.date.split("-");
  var d = new Date(+parts[0], +parts[1]-1, +parts[2]);
  asof.textContent = data.fetched
    ? "taux du " + df.format(d)
    : "taux de secours du " + df.format(d);

  count.textContent = hist.length ? String(hist.length) : "";
}

/* ---- Historique ---------------------------------------------------------- */
function persist(){
  store(LS_HIST, JSON.stringify(hist));
  render();
  if(!panel.hidden) renderHist();
}

var doneTimer = null;
function addEntry(){
  var v = evalLoose(amt.value);
  if(amt.value.trim() === "" || v === null) return;   // rien de valide à garder

  var typed = fullExpr();
  hist.unshift({
    ts: Date.now(),
    from: dir === "EURCAD" ? "EUR" : "CAD",
    to:   dir === "EURCAD" ? "CAD" : "EUR",
    // Valeurs brutes : le formatage arrondit à l'affichage. Arrondir ici aussi
    // ferait diverger les totaux d'un centime.
    amount: v,
    result: convert(v),
    // On ne garde le calcul que s'il en était un : « 34,90 » n'a rien à montrer.
    expr: typed === plain(v) ? "" : typed,
    fee:  fee.checked,
    note: note.value.trim()
  });
  if(hist.length > HMAX) hist.length = HMAX;
  persist();

  note.value = "";
  save.textContent = "✓ Enregistré";
  save.classList.add("done");
  if(doneTimer) clearTimeout(doneTimer);
  doneTimer = setTimeout(function(){
    save.textContent = "Enregistrer";
    save.classList.remove("done");
  }, 1300);
}

function renderHist(){
  // Totaux par devise d'arrivée : mélanger les deux sens n'aurait aucun sens.
  var sums = {};
  hist.forEach(function(e){ sums[e.to] = (sums[e.to] || 0) + e.result; });

  totals.textContent = "";
  Object.keys(sums).forEach(function(cur){
    var el = document.createElement("div");
    el.className = "total";
    el.appendChild(document.createTextNode("Total " + cur + " : "));
    var b = document.createElement("b");
    b.textContent = nf.format(sums[cur]);
    el.appendChild(b);
    totals.appendChild(el);
  });

  list.textContent = "";
  if(!hist.length){
    var none = document.createElement("div");
    none.id = "empty";
    none.textContent = "Aucune conversion enregistrée.";
    list.appendChild(none);
    return;
  }

  hist.forEach(function(e, i){
    var it = document.createElement("div");
    it.className = "item";

    var main = document.createElement("div");
    main.className = "main";

    var conv = document.createElement("div");
    conv.className = "conv";
    conv.appendChild(document.createTextNode(nf.format(e.amount) + " " + e.from));
    var ar = document.createElement("span");
    ar.className = "arrow";
    ar.textContent = "→";
    conv.appendChild(ar);
    conv.appendChild(document.createTextNode(nf.format(e.result) + " " + e.to));
    main.appendChild(conv);

    // Construit en textContent, jamais en innerHTML : la note est du texte libre.
    var bits = [];
    if(e.expr) bits.push(e.expr);
    if(e.fee)  bits.push("carte");
    bits.push(dfh.format(new Date(e.ts)));

    var meta = document.createElement("div");
    meta.className = "meta";
    if(e.note){
      var n = document.createElement("span");
      n.className = "note";
      n.textContent = e.note;
      meta.appendChild(n);
      meta.appendChild(document.createTextNode(" · "));
    }
    meta.appendChild(document.createTextNode(bits.join(" · ")));
    main.appendChild(meta);

    it.appendChild(main);

    var del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "×";
    del.setAttribute("aria-label", "Supprimer cette ligne");
    del.dataset.i = String(i);
    it.appendChild(del);

    list.appendChild(it);
  });
}

function openHist(){ renderHist(); panel.hidden = false; }
function closeHist(){ panel.hidden = true; amt.focus(); }

/* ---- Interactions -------------------------------------------------------- */
amt.addEventListener("input", render);

// Revenir au champ sélectionne le montant précédent : taper le remplace
// directement, sans passer par le retour arrière.
amt.addEventListener("focus", function(){
  try{ amt.select(); }catch(e){}
});

$("keys").addEventListener("pointerdown", function(e){
  var b = e.target.closest("button");
  if(!b) return;
  e.preventDefault();                       // ne pas voler le focus au champ
  var s = amt.selectionStart, en = amt.selectionEnd, val = amt.value;
  if(s === null){ s = en = val.length; }

  if(b.id === "eq"){
    // Replie « 100+50 » en « 150 » pour enchaîner « /2 ». Sans ça il faudrait
    // prévoir une parenthèse avant de commencer à taper, ce que personne ne fait.
    var total = evalLoose(val);
    if(total !== null){
      var before = val.trim();
      amt.value = plain(total);
      s = amt.value.length;
      if(before !== amt.value) folded = { from: before, to: amt.value };
    }
  }else if(b.id === "ac"){
    amt.value = "";
    s = 0;
    folded = null;
  }else if(b.id === "clr"){
    if(s !== en){ amt.value = val.slice(0,s) + val.slice(en); }
    else if(s > 0){ amt.value = val.slice(0,s-1) + val.slice(s); s--; }
  }else{
    var ins = b.getAttribute("data-ins");
    amt.value = val.slice(0,s) + ins + val.slice(en);
    s += ins.length;
  }

  amt.focus();
  try{ amt.setSelectionRange(s,s); }catch(err){}
  render();
});

$("swap").addEventListener("click", function(){
  dir = dir === "EURCAD" ? "CADEUR" : "EURCAD";
  store(LS_DIR, dir);
  render();
  amt.focus();
});

fee.addEventListener("change", function(){
  store(LS_FEE, fee.checked ? "1" : "0");
  render();
});

save.addEventListener("click", addEntry);
note.addEventListener("keydown", function(e){ if(e.key === "Enter") addEntry(); });

$("themeBtn").addEventListener("click", function(){
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  store(LS_THEME, theme);
  applyTheme();
});

$("histBtn").addEventListener("click", openHist);
$("close").addEventListener("click", closeHist);

list.addEventListener("click", function(e){
  var b = e.target.closest(".del");
  if(!b) return;
  hist.splice(Number(b.dataset.i), 1);
  persist();
});

$("wipe").addEventListener("click", function(){
  if(!hist.length) return;
  if(!confirm("Effacer tout l'historique ?")) return;
  hist = [];
  persist();
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && !panel.hidden) closeHist();
});

applyTheme();
render();

/* ---- Taux frais en arrière-plan : l'UI n'attend jamais le réseau ---------- */
function refresh(){
  fetch(API, { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      var v = j && j.rates && j.rates.CAD;
      if(typeof v !== "number" || !isFinite(v) || v <= 0) return;
      data = { rate: v, date: j.date, fetched: Date.now() };
      store(LS_RATE, JSON.stringify(data));
      render();
    })
    .catch(function(){ /* hors-ligne : on garde le taux en cache */ });
}
refresh();
window.addEventListener("online", refresh);
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && Date.now() - (data.fetched||0) > 36e5) refresh();
});

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
  });
}
})();
</script>
